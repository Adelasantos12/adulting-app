        function deepMerge(target, source) {
            for (const key in source) {
                if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                    if (!target[key]) target[key] = {};
                    deepMerge(target[key], source[key]);
                } else {
                    if (target[key] === undefined) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        let loadedState = JSON.parse(localStorage.getItem('modo_adulto_combined_state_v2'));
        let state = loadedState ? deepMerge(loadedState, DEFAULT_STATE) : DEFAULT_STATE;

        function saveState() {
            localStorage.setItem('modo_adulto_combined_state_v2', JSON.stringify(state));
            updateThemeClasses();
            updateAlertIndicators();
        }

        // --- SISTEMA DE TEMAS Y APARIENCIA ---
        function updateThemeClasses() {
            const body = document.body;
            const root = document.documentElement;

            if (state.darkMode) root.classList.add('dark');
            else root.classList.remove('dark');

            // Contrast elevado y escala de grises
            if (state.accessibility.contrastElevated) {
                body.classList.add('contrast-125');
                root.style.setProperty('--contrast-factor', '1.25');
            } else {
                body.classList.remove('contrast-125');
                root.style.removeProperty('--contrast-factor');
            }

            if (state.accessibility.grayscale) {
                body.classList.add('grayscale');
            } else {
                body.classList.remove('grayscale');
            }

            body.classList.remove('font-sans', 'font-serif', 'font-dyslexic', 'font-atkinson');
            if (state.fontStyle === 'dyslexic') body.classList.add('font-dyslexic');
            else if (state.fontStyle === 'serif') body.classList.add('font-serif');
            else if (state.fontStyle === 'atkinson') body.classList.add('font-atkinson');
            else body.classList.add('font-sans');

            body.classList.remove('text-xs', 'text-sm', 'text-base', 'text-lg', 'text-xl');
            body.classList.add('text-' + state.accessibility.fontSize);

            // Inyectar menús de forma dinámica respetando el orden y ocultar módulos configurados
            renderMenus();
        }

        let currentWheelAngle = 0;
        function drawWheel() {
            const canvas = document.getElementById('wheel-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const items = state.todos.filter(t => !t.completed).map(t => t.title);
            if (items.length === 0) {
                ctx.beginPath();
                ctx.arc(125, 125, 120, 0, 2*Math.PI);
                ctx.fillStyle = '#cbd5e1';
                ctx.fill();
                ctx.fillStyle = '#475569';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('Sin tareas pendientes', 125, 125);
                return;
            }

            const arc = (2 * Math.PI) / items.length;
            const colors = ['#f43f5e', '#a855f7', '#0ea5e9', '#22c55e', '#f97316', '#e11d48', '#3b82f6', '#10b981'];

            for (let i = 0; i < items.length; i++) {
                const angle = currentWheelAngle + i * arc;
                ctx.beginPath();
                ctx.arc(125, 125, 120, angle, angle + arc);
                ctx.lineTo(125, 125);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();

                ctx.save();
                ctx.translate(125, 125);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = 'white';
                ctx.font = 'bold 10px sans-serif';
                const displayText = items[i].length > 15 ? items[i].substring(0, 12) + '...' : items[i];
                ctx.fillText(displayText, 110, 4);
                ctx.restore();
            }
        }

        function spinWheel() {
            const items = state.todos.filter(t => !t.completed).map(t => t.title);
            if (items.length === 0) return;

            let velocity = Math.random() * 0.4 + 0.3;
            let friction = 0.985;

            const interval = setInterval(() => {
                currentWheelAngle += velocity;
                drawWheel();
                velocity *= friction;

                if (velocity < 0.002) {
                    clearInterval(interval);
                    const items = state.todos.filter(t => !t.completed).map(t => t.title);
                    const arc = (2 * Math.PI) / items.length;
                    const normAngle = (2 * Math.PI - (currentWheelAngle % (2 * Math.PI))) % (2 * Math.PI);
                    const index = Math.floor(normAngle / arc) % items.length;
                    const winner = items[index];
                    const winnerEl = document.getElementById('wheel-winner');
                    if (winnerEl) winnerEl.innerText = `Siguiente acción: "${winner}" 🚀`;
                }
            }, 16);
        }

            state.accessibility.visibleModules[moduleId] = !current;

                    <div id="climate-info-box" class="p-4 bg-slate-50 dark:bg-slate-900 border rounded-xl leading-relaxed text-left space-y-3">
                        <div id="climate-status" class="text-center font-bold text-slate-500">

                    </div>
                </div>
            `;
        }

        function fetchLocalClimate() {
            const status = document.getElementById('climate-status');
            if (!status) return;

            if (!navigator.geolocation) {
                status.innerHTML = '❌ Tu navegador no soporta geolocalización.';
                return;
            }

            status.innerHTML = '<span class="animate-pulse">Consultando coordenadas GPS...</span>';

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    status.innerHTML = '<span class="animate-pulse">Consultando clima con Open-Meteo...</span>';

                    try {
                        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);
                        const data = await response.json();
                        const temp = data.current_weather.temperature;

                        let rec = '';
                        let emoji = '🧥';
                        if (temp < 15) {
                            emoji = '❄️';
                            rec = '🥶 Hace bastante frío en tu zona. Recomendamos usar abrigo o chamarra abrigadora, una bufanda cómoda, pantalones largos calientes y botas o calzado cerrado.';
                        } else if (temp <= 22) {
                            emoji = '⛅';
                            rec = '🍃 Clima templado y agradable. Ideal para un suéter o cárdigan ligero sobre tu playera, pantalones casuales y tenis cómodos.';
                        } else {
                            emoji = '☀️';
                            rec = '☀️ Hace calor en tu zona. Recomendamos ropa ligera de algodón o lino, bermudas o falda cómoda, lentes de sol y bloqueador solar.';
                        }

                        const emojiEl = document.getElementById('outfit-emoji');
                        if (emojiEl) emojiEl.innerText = emoji;

                        const box = document.getElementById('climate-info-box');
                        if (box) {
                            box.innerHTML = `
                                <div class="space-y-2">
                                    <p class="font-extrabold text-sm text-indigo-600 dark:text-indigo-400">🌡️ Temperatura Actual: ${temp}°C</p>
                                    <p class="text-xs text-slate-700 dark:text-slate-200 font-semibold">${rec}</p>
                                </div>
                            `;
                        }
                    } catch (err) {
                        status.innerHTML = '❌ Error al consultar la API de clima. Revisa tu conexión de internet.';
                    }
                },
                (error) => {
                    status.innerHTML = '❌ Permiso de geolocalización denegado o no disponible.';
                }
            );
        }

                            <button onclick="checkTires(${v.id})" class="flex-1 min-w-[80px] py-2 bg-indigo-50 dark:bg-indigo-950/30 text-indigo-600 dark:text-indigo-400 font-bold rounded-lg text-[10px] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500" style="min-height: 44px;">Revisar Aire</button>

            return `
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                                    No tienes automóviles registrados en tu garaje digital.

                        <!-- Acordeón de 15 temas de supervivencia del coche -->

                                <i data-lucide="book-open" class="w-4 h-4 text-theme-${themeColor}-500" aria-hidden="true"></i>
                                Guías de Supervivencia: Lo Esencial del Automóvil
                            </h3>
                            <p class="text-xs text-slate-500 dark:text-slate-400">Conceptos prácticos explicados de forma directa y limpia, esenciales para la vida adulta diaria que nadie te enseña en el colegio.</p>

                            <div class="space-y-2 border-t border-slate-100 dark:border-slate-700 pt-3">
                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">
                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">
                                        <span>1. Cambiar una llanta ponchada</span>
                                        <span class="transition-transform group-open:rotate-180 text-slate-400"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-xs text-slate-600 dark:text-slate-300 mt-2 leading-relaxed pl-1 border-l-2 border-theme-${themeColor}-500">
                                        Busca un lugar plano y seguro lejos del tráfico. Pon el freno de mano y enciende las intermitentes de emergencia. Afloja los birlos un cuarto de vuelta con la llave de cruz (en sentido antihorario) antes de levantar el auto. Usa el gato hidráulico o mecánico apoyado sobre la sección del chasis indicada en el manual. Eleva el auto, retira los birlos, cambia por la refacción, aprieta los birlos suavemente con la mano, baja el vehículo por completo y realiza el apriete final con fuerza usando la llave de cruz en un patrón de estrella o cruz.
                                    </p>
                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">
                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">
                                        <span>2. Pasar corriente de forma segura (Batería)</span>
                                        <span class="transition-transform group-open:rotate-180 text-slate-400"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-xs text-slate-600 dark:text-slate-300 mt-2 leading-relaxed pl-1 border-l-2 border-theme-${themeColor}-500">
                                        Apaga ambos autos por completo. Conecta el cable <strong>rojo</strong> al terminal positivo (+) de la batería descargada. Conecta el otro extremo <strong>rojo</strong> al positivo (+) de la batería sana. Conecta el cable <strong>negro</strong> al negativo (-) de la batería sana. Conecta el otro extremo <strong>negro</strong> a una parte metálica limpia y sin pintar del motor o chasis del coche descargado (para hacer tierra y evitar chispas cerca de la batería). Enciende el coche sano por unos minutos y luego arranca el coche descargado. Retira en orden inverso exacto.
                                    </p>
                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">
                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">
                                        <span>3. Revisar la presión de los neumáticos</span>
                                        <span class="transition-transform group-open:rotate-180 text-slate-400"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>

                                    <p class="text-xs text-slate-600 dark:text-slate-300 mt-2 leading-relaxed pl-1 border-l-2 border-theme-${themeColor}-500">
                                        La presión óptima no está grabada en la llanta (esa es la presión máxima permitida). La correcta se encuentra en una etiqueta adhesiva en el marco de la puerta del conductor o dentro de la tapa de combustible. Realiza la medición siempre en frío (antes de circular más de 2 km) utilizando un calibrador de bolsillo o en la estación de servicio. Una llanta baja gasta hasta 5% más de combustible y aumenta el riesgo de ponchaduras o derrapes.
                                    </p>
                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">
                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">
                                        <span>4. Entender el testigo de "Check Engine"</span>
                                        <span class="transition-transform group-open:rotate-180 text-slate-400"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>

                                        <span>5. ¿Qué hacer exactamente en un accidente (choque)?</span>
                                        <span class="transition-transform group-open:rotate-180 text-slate-400"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>

                                    <p class="text-xs text-slate-600 dark:text-slate-300 mt-2 leading-relaxed pl-1 border-l-2 border-theme-${themeColor}-500">

                                    </p>
                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">
                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">
                                        <span>6. Medir y rellenar el nivel de aceite del motor</span>

                                    <p class="text-xs text-slate-600 dark:text-slate-300 mt-2 leading-relaxed pl-1 border-l-2 border-theme-${themeColor}-500">

                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">

                                        El líquido de frenos es altamente higroscópico, lo que significa que absorbe humedad del aire con el tiempo. Esto degrada el punto de ebullición del líquido y provoca que, bajo frenados continuos (como descender una pendiente prolongada), el agua se evapore creando burbujas de gas que vuelven el pedal de freno "esponjoso" y reducen drásticamente la capacidad de frenado. Se recomienda purgar y cambiar el líquido de frenos cada 2 años o 40,000 kilómetros.
                                    </p>
                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">
                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">
                                        <span>8. La regla fundamental de rotación de neumáticos</span>

                                        Los neumáticos del eje motriz (habitualmente las llantas delanteras) sufren mucho más desgaste debido a la fuerza de aceleración, frenado y dirección. Rota el juego completo de neumáticos cada 10,000 km cruzando las llantas (ej. las traseras pasan al frente en diagonal, y las delanteras se desplazan atrás directo, dependiendo de si la tracción es trasera o delantera y el tipo de neumático). Esto asegura un desgaste parejo y prolonga la vida útil de tus neumáticos de forma uniforme.
                                    </p>
                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">
                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">

                                        Las gomas limpiaparabrisas deben cambiarse de forma preventiva una vez al año (idealmente justo antes de la temporada de lluvias). Si al activarlas rechinan, dejan líneas opacas de agua en el cristal o saltan, el caucho se ha resecado por el sol. Reemplázalas comprando el repuesto de la medida exacta en pulgadas indicada en el catálogo de tu auto (las de conductor y pasajero suelen medir diferente).
                                    </p>
                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">

                                        <span class="transition-transform group-open:rotate-180 text-slate-400"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>

                                </details>

                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">

                                        <span class="transition-transform group-open:rotate-180 text-slate-400"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>

                                    </p>
                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">
                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">
                                        <span>12. ¿Qué son alineación y balanceo?</span>
                                        <span class="transition-transform group-open:rotate-180 text-slate-400"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-xs text-slate-600 dark:text-slate-300 mt-2 leading-relaxed pl-1 border-l-2 border-theme-${themeColor}-500">
                                        La <strong>alineación</strong> ajusta los ángulos de las ruedas para que queden paralelas entre sí y perpendiculares al camino. Si el volante se siente duro o el auto se va "hacia un lado" al soltarlo brevemente en una recta, necesita alineación. El <strong>balanceo</strong> calibra el peso uniforme de cada llanta mediante pequeños plomos. Si sientes vibración en el volante o el asiento al superar los 80 km/h, las llantas están desbalanceadas, lo que destruye la suspensión a mediano plazo.
                                    </p>
                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">
                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">

                                    </summary>

                                        Por ley en casi todo el país, es estrictamente obligatorio contar con un seguro mínimo de Responsabilidad Civil (daños a terceros). Circular sin él conlleva multas severas y te expone a deudas millonarias en caso de un incidente grave. Asegúrate de tener al día el pago de la prima y guarda siempre la carátula de tu póliza y el teléfono de siniestros de la aseguradora de manera accesible en tu guantera o en esta aplicación.
                                    </p>
                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">
                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">
                                        <span>14. Cómo interpretar las medidas de tus llantas</span>
                                        <span class="transition-transform group-open:rotate-180 text-slate-400"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>

                                    </p>
                                </details>

                                <details class="group border border-slate-100 dark:border-slate-700 rounded-xl p-3 bg-slate-50/50 dark:bg-slate-900/40">
                                    <summary class="font-bold text-xs cursor-pointer select-none text-slate-800 dark:text-slate-200 group-open:text-theme-${themeColor}-600 dark:group-open:text-theme-${themeColor}-400 flex justify-between items-center">
                                        <span>15. Cómo conservar la garantía oficial de fábrica</span>
                                        <span class="transition-transform group-open:rotate-180 text-slate-400"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-xs text-slate-600 dark:text-slate-300 mt-2 leading-relaxed pl-1 border-l-2 border-theme-${themeColor}-500">
                                        Si adquiriste un coche nuevo o seminuevo con garantía de fábrica vigente, debes cumplir rigurosamente el plan de servicios preventivos de mantenimiento indicado en la póliza (habitualmente cada 6 meses o 10,000 km) en la red oficial de agencias autorizadas. Si instalas accesorios eléctricos informales o no oficiales, o realizas reparaciones de motor o suspensión fuera de la agencia autorizada, la marca anulará de inmediato el derecho de garantía mecánica ante cualquier reclamo posterior.
                                    </p>
                                </details>
                            </div>
                        </div>
                    </div>

                    <!-- Guía de Iconos del Tablero (Educación) -->
                    <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm space-y-4">

                        <p class="text-xs text-slate-400">Si se enciende un testigo o luz de advertencia en tu panel, este es su significado esencial:</p>

                                    <strong class="text-red-700 dark:text-red-400 block">Check Engine (Falla de Motor)</strong>
                                    <p class="text-[10px] text-slate-500 dark:text-slate-300">Indica anomalías menores o moderadas en sensores del motor o de emisiones. Llévalo a escanear con escáner OBD2 en tu taller de confianza.</p>

        // --- MÓDULOS DE SOPORTE JS ---
        function checkTires(id) {
            const date = new Date().toISOString().split('T')[0];
            state.autoList = state.autoList.map(v => v.id === id ? { ...v, lastTireCheckDate: date } : v);
            saveState();
            alert("¡Presión de neumáticos e inspección registrada hoy!");
            navigate('auto');
        }

        function rotateTires(id) {
            const date = new Date().toISOString().split('T')[0];
            state.autoList = state.autoList.map(v => v.id === id ? { ...v, lastTireRotationDate: date } : v);
            saveState();
            alert("🔄 ¡Rotación de neumáticos registrada con éxito hoy!");
            navigate('auto');
        }

        function resetOilChange(id) {
            state.autoList = state.autoList.map(v => v.id === id ? { ...v, lastOilMileage: v.mileage } : v);
            saveState();
            alert("🛢️ ¡Servicio de mantenimiento de aceite registrado correctamente!");
            navigate('auto');
        }

        function postponeOilChange(id) {
            state.autoList = state.autoList.map(v => v.id === id ? { ...v, oilChangeInterval: v.oilChangeInterval + 1000 } : v);
            saveState();
            alert("⏰ Snooze: Se ha pospuesto el aviso agregando +1,000 km de tolerancia de forma amigable.");
            navigate('auto');
        }

        function openAddVehicleModal() {
            document.getElementById('vehicle-id').value = '';
            document.getElementById('veh-name').value = '';
            document.getElementById('veh-plate').value = '';
            document.getElementById('veh-brand').value = '';
            document.getElementById('veh-model').value = '';
            document.getElementById('veh-year').value = new Date().getFullYear();
            document.getElementById('veh-mileage').value = '0';
            document.getElementById('veh-last-oil').value = '0';
            document.getElementById('veh-oil-interval').value = '10000';
            document.getElementById('veh-tires-psi').value = '32 PSI';
            document.getElementById('veh-ins-comp').value = '';
            document.getElementById('veh-ins-policy').value = '';
            document.getElementById('veh-ins-phone').value = '';

            document.getElementById('vehicle-modal-title').innerText = 'Añadir Vehículo';
            document.getElementById('add-vehicle-modal').classList.remove('hidden');
        }

        function closeAddVehicleModal() {
            document.getElementById('add-vehicle-modal').classList.add('hidden');
        }

        function saveVehicle(e) {
            e.preventDefault();
            const idVal = document.getElementById('vehicle-id').value;
            const name = document.getElementById('veh-name').value.trim();
            const plate = document.getElementById('veh-plate').value.trim();
            const brand = document.getElementById('veh-brand').value.trim();
            const model = document.getElementById('veh-model').value.trim();
            const year = document.getElementById('veh-year').value.trim();
            const mileage = parseInt(document.getElementById('veh-mileage').value) || 0;
            const lastOil = parseInt(document.getElementById('veh-last-oil').value) || 0;
            const interval = parseInt(document.getElementById('veh-oil-interval').value) || 10000;
            const psi = document.getElementById('veh-tires-psi').value.trim();
            const insComp = document.getElementById('veh-ins-comp').value.trim();
            const insPolicy = document.getElementById('veh-ins-policy').value.trim();
            const insPhone = document.getElementById('veh-ins-phone').value.trim();

            if (idVal) {
                // Editar
                const id = parseInt(idVal);
                state.autoList = state.autoList.map(v => v.id === id ? {
                    ...v, name, plate, brand, model, year, mileage, lastOilMileage: lastOil, oilChangeInterval: interval, tirePressureRecommend: psi, insuranceCompany: insComp, policyNumber: insPolicy, insurancePhone: insPhone
                } : v);
            } else {
                // Agregar nuevo
                state.autoList.push({
                    id: Date.now(),
                    name, plate, brand, model, year, mileage, lastOilMileage: lastOil, oilChangeInterval: interval, tirePressureRecommend: psi, insuranceCompany: insComp, policyNumber: insPolicy, insurancePhone: insPhone,
                    lastTireCheckDate: 'Nunca', lastTireRotationDate: 'Nunca'
                });
            }

            saveState();
            closeAddVehicleModal();
            navigate('auto');
        }

        function editVehicle(id) {
            const v = state.autoList.find(item => item.id === id);
            if (!v) return;

            document.getElementById('vehicle-id').value = v.id;
            document.getElementById('veh-name').value = v.name;
            document.getElementById('veh-plate').value = v.plate;
            document.getElementById('veh-brand').value = v.brand;
            document.getElementById('veh-model').value = v.model;
            document.getElementById('veh-year').value = v.year;
            document.getElementById('veh-mileage').value = v.mileage;
            document.getElementById('veh-last-oil').value = v.lastOilMileage;
            document.getElementById('veh-oil-interval').value = v.oilChangeInterval;
            document.getElementById('veh-tires-psi').value = v.tirePressureRecommend;
            document.getElementById('veh-ins-comp').value = v.insuranceCompany;
            document.getElementById('veh-ins-policy').value = v.policyNumber;
            document.getElementById('veh-ins-phone').value = v.insurancePhone;

            document.getElementById('vehicle-modal-title').innerText = 'Editar Vehículo';
            document.getElementById('add-vehicle-modal').classList.remove('hidden');
        }

        function deleteVehicle(id) {
            if (confirm("¿Estás seguro de eliminar este vehículo de tu garaje digital?")) {
                state.autoList = state.autoList.filter(v => v.id !== id);
                saveState();
                navigate('auto');

        function calculateHoursCost() {
            const price = parseFloat(document.getElementById('eval-price').value) || 0;
            const wage = parseFloat(document.getElementById('eval-hourly').value) || 15;
            const hoursDisplay = document.getElementById('eval-hours-result');
            const ruleDisplay = document.getElementById('eval-pause-rule');

            if (wage <= 0) {
                if (hoursDisplay) hoursDisplay.innerText = '0 horas';
                return;
            }

            const hours = (price / wage).toFixed(1);
            if (hoursDisplay) {
                hoursDisplay.innerText = `${hours} horas de trabajo`;
            }

            if (ruleDisplay) {
                if (price < 20) {
                    ruleDisplay.innerText = 'Pausa de 24 horas recomendada para compras menores de $20.';
                } else if (price < 100) {
                    ruleDisplay.innerText = 'Espera 72 horas para reflexionar si realmente cumple una función real.';
                } else {
                    ruleDisplay.innerText = 'Gasto significativo. Recomendamos una espera deliberada de 15 días antes de adquirir.';
                }
            }
        }

            const status = document.getElementById('ten-min-status');
            if (!status) return;
            status.classList.remove('hidden');

            let sec = 10 * 60;
            if (impulseTimer) clearInterval(impulseTimer);
            impulseTimer = setInterval(() => {
                if (sec > 0) {
                    sec--;
                    const min = Math.floor(sec / 60);
                    const remSec = sec % 60;
                    status.innerText = `⏳ Pausa activa: ${min}:${remSec.toString().padStart(2, "0")} restante. ¡Respira hondo! La urgencia pasará.`;
                } else {
                    clearInterval(impulseTimer);
                    status.innerText = '✅ ¡Felicidades! Lograste pasar los 10 minutos de reflexión.';
                }
            }, 1000);
        }

                                <p class="mt-1 text-slate-500">El cerebro humano genera confianza por mera exposición repetida. Apúntate a clases semanales de senderismo, dibujo o cocina.</p>
                            </div>
                            <div class="p-3 bg-indigo-50 dark:bg-indigo-950/20 rounded-xl font-bold">
                                💡 Truco de iniciación: "Pregunta por intereses, pasatiempos o series, no por trabajo."
                            </div>
                        </div>

                        <!-- Botón de Solitario -->
                        <div class="pt-4 border-t">
                            <button onclick="navigate('solitaire')" class="w-full py-2 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 rounded-xl text-xs font-bold flex items-center justify-center gap-2">
                                <i data-lucide="gamepad-2" class="w-4 h-4"></i> Jugar Solitario (Sin anuncios)
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- SUB-RENDER MÓDULO: SOLITARIO CLÁSICO ---
        function renderModuloSolitaire() {
            return `
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm space-y-4 text-center">
                    <h3 class="font-bold text-base">Solitario Clásico</h3>
                    <p class="text-xs text-slate-400">Juego libre de pop-ups y anuncios molestos para mantener la agudeza mental:</p>

                    <div class="p-8 bg-emerald-800 rounded-3xl min-h-[300px] flex flex-col items-center justify-center text-white space-y-4 shadow-inner">
                        <span class="text-4xl">🃏</span>
                        <h4 class="font-bold text-sm">Mesa de Juego de Cartas</h4>
                        <p class="text-[11px] max-w-sm text-emerald-100">Disfruta de una partida tranquila barajeando cartas sin presiones ni trackers externos.</p>
                        <button onclick="alert('¡Barajeando cartas para una nueva partida interactiva!')" class="px-5 py-2.5 bg-white text-emerald-800 rounded-xl text-xs font-bold shadow-md">Iniciar Partida</button>
                    </div>
                </div>
            `;
        }

        // --- SUB-RENDER MÓDULO: ELLIE THE ASTRONAUT (FLAPPY BIRD CANVAS) ---
        function renderModuloEllie() {
            return `
                <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm space-y-4 text-center flex flex-col items-center">
                    <h3 class="font-bold text-base flex items-center gap-1.5">
                        <i data-lucide="orbit" class="w-5 h-5 text-indigo-500 animate-spin"></i>
                        Ellie the Astronaut - Arcade Game
                    </h3>
                    <p class="text-xs text-slate-400">¡Ayuda a la astronauta Ellie a esquivar los asteroides del espacio profundo esquivando obstáculos!</p>

                    <div class="relative bg-slate-950 rounded-2xl overflow-hidden shadow-2xl border border-indigo-950/40">
                        <canvas id="ellie-canvas" width="400" height="320" class="block bg-slate-950"></canvas>
                        <!-- Pantalla de inicio de juego -->
                        <div id="ellie-start-overlay" class="absolute inset-0 bg-slate-950/80 backdrop-blur-xs flex flex-col items-center justify-center text-white p-4 space-y-4">
                            <span class="text-4xl animate-bounce">🚀</span>
                            <div>
                                <h4 class="font-extrabold text-sm tracking-wide">¿Listo para el despegue?</h4>
                                <p class="text-[10px] text-slate-400 mt-1">Presiona la tecla Espacio o Toca el canvas para brincar y esquivar asteroides.</p>
                            </div>
                            <button onclick="startEllieGame()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-500/10">Iniciar Vuelo</button>
                        </div>
                    </div>
                    <div class="flex gap-4 text-xs font-semibold pt-2">
                        <span>Puntos: <strong id="ellie-score">0</strong></span>
                        <span>Récord: <strong id="ellie-highscore">0</strong></span>
                    </div>
                </div>
            `;
        }

        // --- LÓGICA DE DETECCIÓN CLIC EN LOGO (EASTER EGG) ---
        let logoClickCount = 0;
        function clickLogo() {
            logoClickCount++;
            if (logoClickCount >= 5) {
                logoClickCount = 0;
                alert("¡Felicidades! Descubriste el secreto espacial de la astronauta Ellie 🚀");
                navigate('ellie');
            }
        }

        // --- LÓGICA INTERACTIVA DEL JUEGO ELLIE ---
        let ellieGameActive = false;
        let ellieAnimationId = null;
        let ellieY = 150;
        let ellieVelocity = 0;
        let ellieGravity = 0.25;
        let ellieJump = -4.5;
        let ellieScore = 0;
        let ellieHighscore = 0;
        let obstacles = [];
        let ellieFrameCount = 0;

        function startEllieGame() {
            const overlay = document.getElementById('ellie-start-overlay');
            if (overlay) overlay.classList.add('hidden');

            ellieGameActive = true;
            ellieY = 150;
            ellieVelocity = 0;
            ellieScore = 0;
            obstacles = [];
            ellieFrameCount = 0;
            document.getElementById('ellie-score').innerText = '0';

            const canvas = document.getElementById('ellie-canvas');
            if (!canvas) return;

            // Escuchar saltos (Espacio y Toques)
            canvas.addEventListener('click', ellieTriggerJump);
            window.addEventListener('keydown', ellieSpaceJump);

            if (ellieAnimationId) cancelAnimationFrame(ellieAnimationId);
            ellieGameLoop();
        }

        function ellieTriggerJump() {
            if (ellieGameActive) {
                ellieVelocity = ellieJump;
            }
        }

        function ellieSpaceJump(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                ellieTriggerJump();
            }
        }

        function stopEllieGame() {
            ellieGameActive = false;
            if (ellieAnimationId) cancelAnimationFrame(ellieAnimationId);
            window.removeEventListener('keydown', ellieSpaceJump);

            const overlay = document.getElementById('ellie-start-overlay');
            if (overlay) overlay.classList.remove('hidden');
        }

        function ellieGameLoop() {
            if (!ellieGameActive) return;

            const canvas = document.getElementById('ellie-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            ellieFrameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar estrellas de fondo
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            for (let i = 0; i < 20; i++) {
                const sx = (Math.sin(i * 100) * 0.5 + 0.5) * canvas.width;
                const sy = ((Math.cos(i * 50) * 0.5 + 0.5) * canvas.height + ellieFrameCount * 0.5) % canvas.height;
                ctx.fillRect(sx, sy, 2, 2);
            }

            // 2. Física de Ellie
            ellieVelocity += ellieGravity;
            ellieY += ellieVelocity;

            // Límites del canvas
            if (ellieY < 0) ellieY = 0;
            if (ellieY > canvas.height - 15) {
                ellieGameOver();
                return;
            }

            // Dibujar a Ellie (Cohete espacial o esfera brillante)
            ctx.beginPath();
            ctx.arc(40, ellieY, 8, 0, 2*Math.PI);
            ctx.fillStyle = "#a855f7"; // Púrpura de Ellie
            ctx.fill();
            // Fuego del cohete
            ctx.beginPath();
            ctx.arc(30, ellieY + (Math.sin(ellieFrameCount)*2), 4, 0, 2*Math.PI);
            ctx.fillStyle = "#f97316"; // Naranja
            ctx.fill();

            // 3. Generar Obstáculos (Asteroides)
            if (ellieFrameCount % 100 === 0) {
                const gap = 90;
                const minHeight = 40;
                const maxHeight = canvas.height - gap - minHeight;
                const h = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

                obstacles.push({
                    x: canvas.width,
                    topHeight: h,
                    bottomY: h + gap,
                    width: 32,
                    passed: false
                });
            }

            // 4. Mover y Dibujar Obstáculos
            ctx.fillStyle = "rgba(99,102,241,0.6)"; // Azul espacial
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.x -= 2;

                // Dibujar bloque superior
                ctx.fillRect(o.x, 0, o.width, o.topHeight);
                // Dibujar bloque inferior
                ctx.fillRect(o.x, o.bottomY, o.width, canvas.height - o.bottomY);

                // Colisiones
                if (o.x < 48 && o.x + o.width > 32) {
                    if (ellieY - 8 < o.topHeight || ellieY + 8 > o.bottomY) {
                        ellieGameOver();
                        return;
                    }
                }

                // Sumar puntos
                if (!o.passed && o.x < 32) {
                    o.passed = true;
                    ellieScore++;
                    document.getElementById('ellie-score').innerText = ellieScore;
                    if (ellieScore > ellieHighscore) {
                        ellieHighscore = ellieScore;
                        document.getElementById('ellie-highscore').innerText = ellieHighscore;
                    }
                }

                // Eliminar fuera del canvas
                if (o.x + o.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            ellieAnimationId = requestAnimationFrame(ellieGameLoop);
        }

        function ellieGameOver() {
            ellieGameActive = false;
            alert("🚀 ¡Misión finalizada! Puntuación final: " + ellieScore + " asteroides esquivados.");
            stopEllieGame();
        }

        // --- HOOKS DE INICIALIZACION ---
        const prevInitPageGames = initializePageComponents;
        function initializePageComponents(page) {
            if (page !== 'ellie' && ellieGameActive) {
                stopEllieGame();
            }
            if (page === 'todos') {
                drawWheel();
            }
            if (page === 'outfit') {
                fetchLocalClimate();
            }
            if (typeof prevInitPageGames === 'function' && prevInitPageGames !== initializePageComponents) {
                prevInitPageGames(page);
            }
        }

        window.onload = function() {
            navigate('dashboard');
        };

</script>

</body>
</html>
