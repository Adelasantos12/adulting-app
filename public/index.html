    <style>
        /* Custom scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgb(var(--edge) / 0.5);
            border-radius: 3px;
        }
        @keyframes breathe {
            0%, 100% { transform: scale(1); background-color: rgb(var(--accent) / 0.15); }
            40% { transform: scale(1.45); background-color: rgb(var(--accent) / 0.35); }
            60% { transform: scale(1.45); background-color: rgb(var(--accent) / 0.35); }
        }
        .breathing-circle {
            animation: breathe 12s infinite ease-in-out;
        }
        .wheel-container {
            position: relative;
        }
    </style>
</head>
<body class="h-full bg-ground text-ink font-sans">
    <div id="app" class="flex h-full overflow-hidden">
        <!-- Sidebar (Escritorio) -->
        <aside id="sidebar" class="hidden md:flex flex-col w-64 bg-surface-1 border-r border-line h-full flex-shrink-0">

                        <i data-lucide="sparkles" class="w-5 h-5"></i>
                    </span>
                    <div>
                        <h1 class="font-bold text-ink text-base">Modo Adulto®</h1>

            </div>

            <!-- Menú de Navegación -->

                    </div>
                </div>
            </div>
        </aside>

        <!-- Contenido principal -->
        <main class="flex-1 flex flex-col h-full overflow-hidden relative">
            <!-- Header -->
            <header class="flex items-center justify-between px-6 py-4 bg-ground border-b border-line z-10 flex-shrink-0">
                <div class="flex items-center gap-2 md:hidden" onclick="clickLogo()">
                    <span class="p-1.5 bg-accent-fill text-white rounded-lg font-bold flex items-center justify-center">
                        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
                    </span>
                    <h1 class="font-bold text-ink text-sm">Modo Adulto</h1>
                </div>
                <div class="hidden md:block">

        function deepMerge(target, source) {
            for (const key in source) {
                if (source[key] && typeof source[key] === 'object' && !Array.isArray(source[key])) {
                    if (!target[key]) target[key] = {};
                    deepMerge(target[key], source[key]);
                } else {
                    if (target[key] === undefined) {
                        target[key] = source[key];
                    }
                }
            }
            return target;
        }

        // Copia limpia de los valores por defecto, para no mezclar datos del usuario con DEFAULT_STATE.
        function freshDefaults() {
            return JSON.parse(JSON.stringify(DEFAULT_STATE));
        }

        let loadedState = JSON.parse(localStorage.getItem('modo_adulto_combined_state_v2'));
        let state = loadedState ? deepMerge(loadedState, freshDefaults()) : freshDefaults();

        if (!state.designVersion || state.designVersion < 2) {
            if (['xs', 'sm'].includes(state.accessibility.fontSize)) state.accessibility.fontSize = 'base';
            if (state.theme === 'purple') state.theme = 'green';
            if (state.fontStyle === 'dyslexic') state.fontStyle = 'sans';
            state.designVersion = 2;
        }

        // El sueldo por hora de ejemplo era 15 (en dólares) y antes no se podía guardar otro: se pasa al de México
        if (state.designVersion < 3) {
            if (state.hourlyWage === 15) state.hourlyWage = 60;
            state.designVersion = 3;
        }

        function saveState() {
            const json = JSON.stringify(state);
            localStorage.setItem('modo_adulto_combined_state_v2', json);
            persistNative(json);
            updateThemeClasses();
            updateAlertIndicators();
        }

        // --- SISTEMA DE TEMAS Y APARIENCIA ---
        function updateThemeClasses() {
            const body = document.body;
            const root = document.documentElement;

            if (state.darkMode) root.classList.add('dark');
            else root.classList.remove('dark');

            // Contrast elevado y escala de grises
            if (state.accessibility.contrastElevated) {
                body.classList.add('contrast-125');
                root.style.setProperty('--contrast-factor', '1.25');
            } else {
                body.classList.remove('contrast-125');
                root.style.removeProperty('--contrast-factor');
            }

            if (state.accessibility.grayscale) {
                body.classList.add('grayscale');
            } else {
                body.classList.remove('grayscale');
            }

            root.classList.toggle('reduce-motion', !!state.accessibility.reduceMotion);

            // Acento elegido (verde de la Biblia por defecto); los valores están en src/tailwind.css
            root.classList.remove('accent-purple', 'accent-blue', 'accent-rose', 'accent-orange');
            if (state.theme && state.theme !== 'green') root.classList.add('accent-' + state.theme);

            body.classList.remove('font-sans', 'font-serif', 'font-atkinson');
            if (state.fontStyle === 'serif') body.classList.add('font-serif');
            else if (state.fontStyle === 'atkinson') body.classList.add('font-atkinson');
            else body.classList.add('font-sans');

            // Tamaño de texto: escala la raíz, así todo crece junto y se respeta el ajuste del sistema
            const rootSizes = { sm: '87.5%', base: '100%', lg: '112.5%', xl: '125%' };
            root.style.fontSize = rootSizes[state.accessibility.fontSize] || '100%';

            // Espaciado entre letras ajustable de 0.04em a 0.12em (CORE 4.3)
            root.style.setProperty('--text-tracking', (state.accessibility.letterSpacing || 0.04) + 'em');

            // Inyectar menús de forma dinámica respetando el orden y ocultar módulos configurados
            renderMenus();
        }

        function toggleDarkMode() {
            state.darkMode = !state.darkMode;
            saveState();
        }

            outfit: 'Qué me pongo',
            solitaire: 'Solitario',
            ellie: 'Ellie the Astronaut'

        // --- NAVEGACIÓN DINÁMICA DE MENÚS (ACCESIBILIDAD) ---
        function renderMenus() {
            const themeColor = state.theme;
            const vis = state.accessibility.visibleModules;

            const menuItems = [
                { id: 'dashboard', label: 'Hoy', short: 'Hoy', icon: 'layout-dashboard', visible: true },
                { id: 'todos', label: 'Tareas y ruleta', short: 'Tareas', icon: 'check-square', visible: vis.todos !== false },
                { id: 'money', label: 'Dinero sin drama', short: 'Dinero', icon: 'wallet', visible: vis.money !== false },
                { id: 'shopping', label: '¿Comprar o no?', short: 'Comprar', icon: 'shopping-bag', visible: vis.shopping !== false },
                { id: 'food', label: 'Alimentación', short: 'Comida', icon: 'apple', visible: vis.food !== false },
                { id: 'pets', label: 'Mis mascotas', short: 'Mascotas', icon: 'paw-print', visible: vis.pets !== false },
                { id: 'auto', label: 'Mi automóvil', short: 'Auto', icon: 'car', visible: vis.auto !== false },
                { id: 'health', label: 'Hábitos y salud', short: 'Salud', icon: 'heart', visible: vis.health !== false },
                { id: 'house', label: 'Casa funcional', short: 'Casa', icon: 'home', visible: vis.house !== false },
                { id: 'outfit', label: 'Qué me pongo', short: 'Clima', icon: 'cloud-sun', visible: vis.outfit !== false },
                { id: 'paz', label: 'Paz en redes', short: 'Diario', icon: 'instagram', visible: vis.paz !== false },
                { id: 'guides', label: 'Dudas y conversaciones', short: 'Dudas', icon: 'book-open', visible: vis.guides !== false },
                { id: 'settings', label: 'Ajustes', short: 'Ajustes', icon: 'settings', visible: true }
            ];

            // El acento sigue al tema elegido mediante variables CSS (src/tailwind.css)
            const activeColor = { primary: 'text-accent', activeBg: 'bg-accent-soft text-accent' };

            // Render Lateral (Escritorio)
            let sidebarHtml = '';
            menuItems.forEach(item => {
                if (item.visible) {
                    const isActive = item.id === currentPage;
                    sidebarHtml += `
                        <button onclick="navigate('${item.id}')" class="nav-btn w-full flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-semibold transition-all duration-150 ${isActive ? activeColor.activeBg : 'text-ink-soft hover:bg-surface-1 '}" data-page="${item.id}">
                            <i data-lucide="${item.icon}" class="w-4 h-4"></i>
                            ${item.label}
                        </button>
                    `;
                }
            });
            document.getElementById('sidebar-nav').innerHTML = sidebarHtml;

            // Render Inferior (Móvil)
            let mobileHtml = '';
            menuItems.forEach(item => {
                if (item.visible) {
                    const isActive = item.id === currentPage;
                    mobileHtml += `
                        <button onclick="navigate('${item.id}')" class="mobile-nav-btn flex-shrink-0 w-[4.75rem] flex flex-col items-center justify-center gap-0.5 text-xs font-semibold rounded-xl ${isActive ? activeColor.activeBg : 'text-ink-faint'}" data-page="${item.id}">
                            <i data-lucide="${item.icon}" class="w-5 h-5"></i>
                            <span class="w-full truncate text-center px-1">${item.short || item.label.split(' ')[0]}</span>
                        </button>
                    `;
                }
            });
            document.getElementById('mobile-nav').innerHTML = mobileHtml;

            lucide.createIcons();
        }

        function navigate(page) {
            currentPage = page;
            const pageTitle = document.getElementById('page-title');
            if (pageTitle) pageTitle.innerText = pageTitles[page] || 'Modo Adulto';

            const pageContent = document.getElementById('page-content');
            if (pageContent) {
                // Al cambiar de sección se empieza arriba; al redibujar la misma sección se conserva la posición
                const samePage = pageContent.dataset.page === page;
                pageContent.innerHTML = renderPage(page);
                pageContent.dataset.page = page;
                if (!samePage) pageContent.scrollTop = 0;
                initializePageComponents(page);
            }

            updateThemeClasses();
            lucide.createIcons();
        }

        // --- SISTEMA DE ALERTAS ---
        function checkAlerts() {
            let hasAlerts = false;
            state.autoList.forEach(v => {
                if (v.mileage - v.lastOilMileage >= v.oilChangeInterval) hasAlerts = true;
            });
            state.budget.bills.forEach(b => {
                if (!b.paid) {
                    if (new Date(b.dueDate) < new Date()) hasAlerts = true;
                }
            });
            return hasAlerts;
        }

        function updateAlertIndicators() {
            const hasAlerts = checkAlerts();
            const dot = document.getElementById('quick-alert-dot');
            const alertText = document.getElementById('quick-alert-text');
            if (dot) {
                if (hasAlerts) {
                    dot.classList.remove('hidden');
                    if (alertText) alertText.innerText = "Hay pagos o mantenimientos pendientes en tu panel.";
                } else {
                    dot.classList.add('hidden');
                    if (alertText) alertText.innerText = "Sin alertas pendientes de mantenimiento o pagos.";
                }
            }
        }

        // --- FUNCIÓN DE APOYO: OBTENER FRASE DE ÁNIMO ---
        const FRASES_ANIMO = {
            amable: [

        let currentWheelAngle = 0;
        function drawWheel() {
            const canvas = document.getElementById('wheel-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            // Colores de los tokens: segmentos alternos en superficie, separados por línea (el color no distingue nada)
            const css = getComputedStyle(document.documentElement);
            const tokenColor = (name) => `rgb(${css.getPropertyValue('--' + name).trim().split(/\s+/).join(',')})`;
            const font = getComputedStyle(document.body).fontFamily;
            const items = state.todos.filter(t => !t.completed).map(t => t.title);
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (items.length === 0) {
                ctx.beginPath();
                ctx.arc(125, 125, 120, 0, 2*Math.PI);
                ctx.fillStyle = tokenColor('surface-1');
                ctx.fill();
                ctx.fillStyle = tokenColor('ink-soft');
                ctx.font = `600 14px ${font}`;
                ctx.textAlign = 'center';
                ctx.fillText('Sin tareas pendientes', 125, 125);
                return;
            }

            const arc = (2 * Math.PI) / items.length;
            const colors = [tokenColor('card'), tokenColor('surface-2')];

            for (let i = 0; i < items.length; i++) {
                const angle = currentWheelAngle + i * arc;
                ctx.beginPath();
                ctx.arc(125, 125, 120, angle, angle + arc);
                ctx.lineTo(125, 125);
                ctx.fillStyle = colors[i % colors.length];
                ctx.fill();
                ctx.strokeStyle = tokenColor('edge');
                ctx.lineWidth = 1;
                ctx.stroke();

                ctx.save();
                ctx.translate(125, 125);
                ctx.rotate(angle + arc / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = tokenColor('ink');
                ctx.font = `600 13px ${font}`;
                const displayText = items[i].length > 15 ? items[i].substring(0, 12) + '...' : items[i];
                ctx.fillText(displayText, 110, 4);
                ctx.restore();
            }
        }

        // La tarea se elige primero (sin repetir la anterior si hay más de una) y la ruleta gira hasta dejarla bajo la flecha de arriba
        let lastWheelWinner = null;
        let wheelSpinning = false;

        function spinWheel() {
            if (wheelSpinning) return;
            const items = state.todos.filter(t => !t.completed).map(t => t.title);
            if (items.length === 0) return;

            const candidates = items.map((_, i) => i).filter(i => items.length === 1 || items[i] !== lastWheelWinner);
            const index = pickRandom(candidates);
            const arc = (2 * Math.PI) / items.length;
            const jitter = (Math.random() - 0.5) * arc * 0.7;
            // Ángulo en que el centro de la rebanada elegida queda arriba (-90°)
            const target = -Math.PI / 2 - (index + 0.5) * arc + jitter;
            const fullTurn = 2 * Math.PI;
            const delta = ((target - currentWheelAngle) % fullTurn + fullTurn) % fullTurn;

            const winnerEl = document.getElementById('wheel-winner');
            const finish = () => {
                wheelSpinning = false;
                lastWheelWinner = items[index];
                const button = document.getElementById('wheel-button');
                if (button) button.disabled = false;
                const el = document.getElementById('wheel-winner');
                if (el) el.innerText = `Siguiente: ${items[index]}`;
            };

            // Con movimiento reducido no hay giro: se dibuja la posición final
            if (prefersReducedMotion()) {
                currentWheelAngle += delta;
                drawWheel();
                finish();
                return;
            }

            wheelSpinning = true;
            const button = document.getElementById('wheel-button');
            if (button) button.disabled = true;
            if (winnerEl) winnerEl.innerText = '';

            const start = currentWheelAngle;
            const distance = delta + fullTurn * (4 + Math.floor(Math.random() * 3));
            const duration = 3500;
            const startTime = performance.now();
            const easeOut = (t) => 1 - Math.pow(1 - t, 3);

            // Avanza por tiempo transcurrido, así termina igual aunque la app pase a segundo plano a medio giro
            function frame() {
                const t = Math.min((performance.now() - startTime) / duration, 1);
                currentWheelAngle = start + distance * easeOut(t);
                drawWheel();
                if (t < 1) setTimeout(frame, 16);
                else finish();
            }
            frame();
        }

        // --- RESPALDO DE DATOS ---
        const BACKUP_FORMAT = 'modo-adulto-respaldo';

        async function exportBackup() {
            const today = new Date().toISOString().slice(0, 10);
            const filename = `modo-adulto-respaldo-${today}.json`;
            const backup = { format: BACKUP_FORMAT, version: 1, exportedAt: new Date().toISOString(), state: state };
            try {
                const result = await saveTextFile(filename, JSON.stringify(backup, null, 2));
                if (result === 'downloaded') setBackupStatus(`Respaldo descargado: ${filename}`);
                else if (result === 'shared') setBackupStatus(`Respaldo listo: ${filename}. Guárdalo en Archivos, Drive o mándatelo por correo.`);
            } catch (e) {
                setBackupStatus('No se pudo crear el respaldo. Puedes intentarlo otra vez.');
            }
        }

        function importBackup(input) {
            const file = input.files && input.files[0];
            input.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                let imported;
                try {
                    const parsed = JSON.parse(reader.result);
                    imported = parsed && parsed.format === BACKUP_FORMAT ? parsed.state : null;
                } catch (e) {
                    imported = null;
                }
                if (!imported || typeof imported !== 'object' || !imported.accessibility) {
                    setBackupStatus('Ese archivo no es un respaldo de Modo Adulto. Elige el archivo .json que descargaste desde aquí.');
                    return;
                }
                if (!confirm('Esto reemplaza los datos de este dispositivo por los del respaldo. Si quieres conservar los actuales, descarga primero un respaldo. ¿Continuar?')) {
                    setBackupStatus('No se cambió nada.');
                    return;
                }
                state = deepMerge(imported, freshDefaults());
                saveState();
                navigate('settings');
                setBackupStatus('Respaldo cargado. Tus datos ya están en este dispositivo.');
            };
            reader.onerror = function() {
                setBackupStatus('No se pudo leer el archivo. Puedes intentarlo otra vez.');
            };
            reader.readAsText(file);
        }

        function setBackupStatus(message) {
            const el = document.getElementById('backup-status');
            if (el) el.textContent = message;
        }

            if (code <= 3) return { label: 'Parcialmente nublado', icon: 'cloud-sun' };
            if (code <= 48) return { label: 'Neblina', icon: 'cloud-fog' };
            if (code <= 67 || (code >= 80 && code <= 82)) return { label: 'Lluvia', icon: 'cloud-rain', rain: true };
            if (code <= 77 || code === 85 || code === 86) return { label: 'Nieve', icon: 'cloud-snow', rain: true };

        // Signo zodiacal a partir de 'AAAA-MM-DD'. Se lee la fecha sin zona horaria para que no se recorra un día.
        function getZodiacSign(dateString) {
            if (!dateString) return "Desconocido";
            const [, m, d] = dateString.split('-').map(Number);
            if (!m || !d) return "Desconocido";
            if ((m == 3 && d >= 21) || (m == 4 && d <= 19)) return "Aries ";
            if ((m == 4 && d >= 20) || (m == 5 && d <= 20)) return "Tauro ";
            if ((m == 5 && d >= 21) || (m == 6 && d <= 20)) return "Géminis ";
            if ((m == 6 && d >= 21) || (m == 7 && d <= 22)) return "Cáncer ";
            if ((m == 7 && d >= 23) || (m == 8 && d <= 22)) return "Leo ";
            if ((m == 8 && d >= 23) || (m == 9 && d <= 22)) return "Virgo ";
            if ((m == 9 && d >= 23) || (m == 10 && d <= 22)) return "Libra ";
            if ((m == 10 && d >= 23) || (m == 11 && d <= 21)) return "Escorpio ";
            if ((m == 11 && d >= 22) || (m == 12 && d <= 21)) return "Sagitario ";
            if ((m == 12 && d >= 22) || (m == 1 && d <= 19)) return "Capricornio ";
            if ((m == 1 && d >= 20) || (m == 2 && d <= 18)) return "Acuario ";
            return "Piscis ";
        }

                            <h3 class="text-base font-bold">Mis vehículos registrados</h3>
                            <button onclick="openAddVehicleModal()" class="px-4 py-2 bg-accent-fill hover:bg-accent-fill-strong text-white rounded-xl text-sm font-bold shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-accent" style="min-height: 44px;">+ Añadir auto</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            ${autosHtml !== '' ? autosHtml : `
                                <div class="col-span-2 text-center py-10 bg-card rounded-2xl border text-ink-faint border-line">
                                    No tienes automóviles registrados en tu garaje digital.
                                </div>

                        </div>

                        <!-- Acordeón de 15 temas de supervivencia del coche -->
                        <div class="bg-card p-6 rounded-2xl border border-line shadow-sm space-y-4 mt-6">
                            <h3 class="text-base font-extrabold text-ink flex items-center gap-1.5">
                                <i data-lucide="book-open" class="w-4 h-4 text-accent" aria-hidden="true"></i>
                                Guías de Supervivencia: Lo Esencial del Automóvil
                            </h3>
                            <p class="text-sm text-ink-faint">Conceptos prácticos explicados de forma directa y limpia, esenciales para la vida adulta diaria que nadie te enseña en el colegio.</p>

                            <div class="space-y-2 border-t border-line pt-3">
                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>1. Cambiar una llanta ponchada</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        Busca un lugar plano y seguro lejos del tráfico. Pon el freno de mano y enciende las intermitentes de emergencia. Afloja los birlos un cuarto de vuelta con la llave de cruz (en sentido antihorario) antes de levantar el auto. Usa el gato hidráulico o mecánico apoyado sobre la sección del chasis indicada en el manual. Eleva el auto, retira los birlos, cambia por la refacción, aprieta los birlos suavemente con la mano, baja el vehículo por completo y realiza el apriete final con fuerza usando la llave de cruz en un patrón de estrella o cruz.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>2. Pasar corriente de forma segura (batería)</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        Apaga ambos autos por completo. Conecta el cable <strong>rojo</strong> al terminal positivo (+) de la batería descargada. Conecta el otro extremo <strong>rojo</strong> al positivo (+) de la batería sana. Conecta el cable <strong>negro</strong> al negativo (-) de la batería sana. Conecta el otro extremo <strong>negro</strong> a una parte metálica limpia y sin pintar del motor o chasis del coche descargado (para hacer tierra y evitar chispas cerca de la batería). Enciende el coche sano por unos minutos y luego arranca el coche descargado. Retira en orden inverso exacto.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>3. Revisar la presión de los neumáticos</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        La presión óptima no está grabada en la llanta (esa es la presión máxima permitida). La correcta se encuentra en una etiqueta adhesiva en el marco de la puerta del conductor o dentro de la tapa de combustible. Realiza la medición siempre en frío (antes de circular más de 2 km) utilizando un calibrador de bolsillo o en la estación de servicio. Una llanta baja gasta hasta 5% más de combustible y aumenta el riesgo de ponchaduras o derrapes.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>4. Entender el testigo de "Check Engine"</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        Si se ilumina de forma fija, hay un fallo menor o moderado en los sistemas electrónicos o de combustión (a veces incluso un tapón de gasolina mal cerrado). Puedes conducir a velocidad baja hasta un taller. Sin embargo, <strong>si la luz parpadea</strong> de manera continua, detén el coche de inmediato, ya que indica un fallo grave (como pérdida de combustión o sobrecalentamiento del catalizador) que puede destruir el motor en minutos.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>5. ¿Qué hacer exactamente en un accidente (choque)?</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        Mantén la calma y mantente dentro de tu coche si estás en una vía rápida. Enciende de inmediato las intermitentes de emergencia. Llama directamente al teléfono de tu aseguradora que tienes registrado en tu app o póliza. Toma fotos panorámicas claras del entorno, del impacto y de la matrícula del otro vehículo involucrado antes de moverlos (si es obligatorio despejar la vía en tu estado). Nunca asumas la culpa ni firmes acuerdos informales o pagues en efectivo sin la asistencia de tu ajustador oficial de seguros.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>6. Medir y rellenar el nivel de aceite del motor</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        Con el vehículo apagado, en plano y con el motor totalmente frío. Abre el cofre, retira la varilla medidora de aceite (suele tener un aro de plástico de color llamativo), límpiala por completo con una servilleta o trapo seco, introdúcela de nuevo hasta el fondo y vuelve a extraerla. El nivel de aceite debe marcar entre los dos puntos o muescas de 'Min' y 'Max'. Si está por debajo de 'Min', agrega un cuarto de litro del aceite exacto recomendado en el manual del auto y repite la medición.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>7. Cuándo y por qué cambiar el líquido de frenos</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        El líquido de frenos es altamente higroscópico, lo que significa que absorbe humedad del aire con el tiempo. Esto degrada el punto de ebullición del líquido y provoca que, bajo frenados continuos (como descender una pendiente prolongada), el agua se evapore creando burbujas de gas que vuelven el pedal de freno "esponjoso" y reducen drásticamente la capacidad de frenado. Se recomienda purgar y cambiar el líquido de frenos cada 2 años o 40,000 kilómetros.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>8. La regla fundamental de rotación de neumáticos</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        Los neumáticos del eje motriz (habitualmente las llantas delanteras) sufren mucho más desgaste debido a la fuerza de aceleración, frenado y dirección. Rota el juego completo de neumáticos cada 10,000 km cruzando las llantas (ej. las traseras pasan al frente en diagonal, y las delanteras se desplazan atrás directo, dependiendo de si la tracción es trasera o delantera y el tipo de neumático). Esto asegura un desgaste parejo y prolonga la vida útil de tus neumáticos de forma uniforme.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>9. Limpiaparabrisas: mantenimiento y reemplazo</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        Las gomas limpiaparabrisas deben cambiarse de forma preventiva una vez al año (idealmente justo antes de la temporada de lluvias). Si al activarlas rechinan, dejan líneas opacas de agua en el cristal o saltan, el caucho se ha resecado por el sol. Reemplázalas comprando el repuesto de la medida exacta en pulgadas indicada en el catálogo de tu auto (las de conductor y pasajero suelen medir diferente).
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>10. Líquido refrigerante y prevención de quemaduras</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        El anticongelante mantiene el motor en su rango de temperatura óptimo. <strong>No quites la tapa del radiador ni del contenedor de expansión con el motor caliente!</strong> El sistema se encuentra bajo una altísima presión y temperatura; abrirlo causará que el líquido hirviendo salga disparado en forma de chorro o vapor provocando quemaduras severas de tercer grado. Rellena únicamente cuando el coche esté totalmente frío, utilizando el compuesto exacto premezclado (refrigerante/agua 50/50).
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">

                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        Lleva siempre en la cajuela: una llanta de refacción bien calibrada, un gato compatible con tu vehículo, llave de cruz, cables pasacorriente de buen calibre (mínimo calibre 8 para resistir la corriente), dos triángulos reflejantes para advertir en carretera, una linterna que funcione sin necesidad de batería del coche (ej. recargable o dinamo), y un impermeable ligero. Este kit te salvará de horas de espera varado.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>12. ¿Qué son alineación y balanceo?</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        La <strong>alineación</strong> ajusta los ángulos de las ruedas para que queden paralelas entre sí y perpendiculares al camino. Si el volante se siente duro o el auto se va "hacia un lado" al soltarlo brevemente en una recta, necesita alineación. El <strong>balanceo</strong> calibra el peso uniforme de cada llanta mediante pequeños plomos. Si sientes vibración en el volante o el asiento al superar los 80 km/h, las llantas están desbalanceadas, lo que destruye la suspensión a mediano plazo.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>13. El seguro de automóvil obligatorio</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        Por ley en casi todo el país, es estrictamente obligatorio contar con un seguro mínimo de Responsabilidad Civil (daños a terceros). Circular sin él conlleva multas severas y te expone a deudas millonarias en caso de un incidente grave. Asegúrate de tener al día el pago de la prima y guarda siempre la carátula de tu póliza y el teléfono de siniestros de la aseguradora de manera accesible en tu guantera o en esta aplicación.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>14. Cómo interpretar las medidas de tus llantas</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        En el costado de tu llanta verás códigos como <strong>205/55 R16</strong>. El primer número (205) es el ancho del neumático en milímetros. El segundo número (55) es la altura del perfil expresada en porcentaje respecto al ancho (el perfil de esta llanta es el 55% de 205 mm). La 'R' significa construcción Radial. El último número (16) indica el diámetro del rin en pulgadas. Al cambiar neumáticos, debes respetar la especificación del chasis para no alterar la lectura del velocímetro ni dañar la transmisión.
                                    </p>
                                </details>

                                <details class="group border border-line rounded-xl p-3 bg-surface-1">
                                    <summary class="font-bold text-sm cursor-pointer select-none text-ink group-open:text-accent flex justify-between items-center">
                                        <span>15. Cómo conservar la garantía oficial de fábrica</span>
                                        <span class="transition-transform group-open:rotate-180 text-ink-faint"><i data-lucide="chevron-down" class="w-3.5 h-3.5" aria-hidden="true"></i></span>
                                    </summary>
                                    <p class="text-sm text-ink-soft mt-2 leading-relaxed pl-1 border-l-2 border-accent">
                                        Si adquiriste un coche nuevo o seminuevo con garantía de fábrica vigente, debes cumplir rigurosamente el plan de servicios preventivos de mantenimiento indicado en la póliza (habitualmente cada 6 meses o 10,000 km) en la red oficial de agencias autorizadas. Si instalas accesorios eléctricos informales o no oficiales, o realizas reparaciones de motor o suspensión fuera de la agencia autorizada, la marca anulará de inmediato el derecho de garantía mecánica ante cualquier reclamo posterior.
                                    </p>
                                </details>
                            </div>
                        </div>
                    </div>

        function saveVehicle(e) {
            e.preventDefault();
            const idVal = document.getElementById('vehicle-id').value;
            const name = document.getElementById('veh-name').value.trim();
            const plate = document.getElementById('veh-plate').value.trim();
            const brand = document.getElementById('veh-brand').value.trim();
            const model = document.getElementById('veh-model').value.trim();
            const year = document.getElementById('veh-year').value.trim();
            const mileage = parseInt(document.getElementById('veh-mileage').value) || 0;
            const lastOil = parseInt(document.getElementById('veh-last-oil').value) || 0;
            const interval = parseInt(document.getElementById('veh-oil-interval').value) || 10000;
            const psi = document.getElementById('veh-tires-psi').value.trim();
            const insComp = document.getElementById('veh-ins-comp').value.trim();
            const insPolicy = document.getElementById('veh-ins-policy').value.trim();
            const insPhone = document.getElementById('veh-ins-phone').value.trim();

            if (idVal) {
                // Editar
                const id = parseInt(idVal);
                state.autoList = state.autoList.map(v => v.id === id ? {
                    ...v, name, plate, brand, model, year, mileage, lastOilMileage: lastOil, oilChangeInterval: interval, tirePressureRecommend: psi, insuranceCompany: insComp, policyNumber: insPolicy, insurancePhone: insPhone
                } : v);
            } else {
                // Agregar nuevo
                state.autoList.push({
                    id: Date.now(),
                    name, plate, brand, model, year, mileage, lastOilMileage: lastOil, oilChangeInterval: interval, tirePressureRecommend: psi, insuranceCompany: insComp, policyNumber: insPolicy, insurancePhone: insPhone,
                    lastTireCheckDate: 'Nunca', lastTireRotationDate: 'Nunca'
                });
            }

            saveState();
            closeAddVehicleModal();
            navigate('auto');
        }

            const v = state.autoList.find(item => item.id === id);
            if (!v) return;

            document.getElementById('vehicle-id').value = v.id;
            document.getElementById('veh-name').value = v.name;
            document.getElementById('veh-plate').value = v.plate;
            document.getElementById('veh-brand').value = v.brand;

            document.getElementById('veh-mileage').value = v.mileage;

        // --- HELPER FUNCTIONS FOR COMPRAS CONSCIENTES ---
        function calculateHoursCost() {
            const price = parseFloat(document.getElementById('eval-price').value) || 0;
            const wage = parseFloat(document.getElementById('eval-hourly').value) || 0;
            const hoursDisplay = document.getElementById('eval-hours-result');
            const ruleDisplay = document.getElementById('eval-pause-rule');

            if (wage <= 0) {
                if (hoursDisplay) hoursDisplay.innerText = '0 horas';
                return;
            }

            if (wage !== state.hourlyWage) {
                state.hourlyWage = wage;
                saveState();
            }

            const hours = (price / wage).toFixed(1);
            if (hoursDisplay) {
                hoursDisplay.innerText = `${hours} horas de trabajo`;
            }

            if (ruleDisplay) {
                // La espera se mide en horas de trabajo, no en pesos: así sirve para cualquier sueldo
                const workHours = price / wage;
                if (price <= 0) {
                    ruleDisplay.innerText = 'Escribe el precio y cuánto ganas por hora: la espera depende de cuántas horas de trabajo te cuesta.';
                } else if (workHours < 1) {
                    ruleDisplay.innerText = 'Te cuesta menos de una hora de trabajo. Si lo necesitas y cabe en tu presupuesto, no hace falta esperar.';
                } else if (workHours < 8) {
                    ruleDisplay.innerText = 'Te cuesta hasta un día de trabajo. Espera 24 horas y decide con calma.';
                } else if (workHours < 40) {
                    ruleDisplay.innerText = 'Te cuesta hasta una semana de trabajo. Espera 72 horas y piensa si de verdad lo vas a usar.';
                } else {
                    ruleDisplay.innerText = 'Te cuesta más de una semana de trabajo. Espera 15 días y compara precios antes de comprarlo.';
                }
            }
        }

        // --- LÓGICA DE DETECCIÓN CLIC EN LOGO (EASTER EGG) ---
        let logoClickCount = 0;
        function clickLogo() {
            if (state.accessibility.visibleModules.games !== true) return;

            if (logoClickCount >= 5) {
                logoClickCount = 0;

        // --- LÓGICA INTERACTIVA DEL JUEGO ELLIE ---
        let ellieGameActive = false;
        let ellieAnimationId = null;
        let ellieY = 150;
        let ellieVelocity = 0;
        let ellieGravity = 0.25;
        let ellieJump = -4.5;
        let ellieScore = 0;
        let ellieHighscore = 0;
        let obstacles = [];
        let ellieFrameCount = 0;

        function startEllieGame() {
            const overlay = document.getElementById('ellie-start-overlay');
            if (overlay) overlay.classList.add('hidden');

            ellieGameActive = true;
            ellieY = 150;
            ellieVelocity = 0;
            ellieScore = 0;
            obstacles = [];
            ellieFrameCount = 0;
            document.getElementById('ellie-score').innerText = '0';

            const canvas = document.getElementById('ellie-canvas');
            if (!canvas) return;

            // Escuchar saltos (Espacio y Toques)
            canvas.addEventListener('click', ellieTriggerJump);
            window.addEventListener('keydown', ellieSpaceJump);

            if (ellieAnimationId) cancelAnimationFrame(ellieAnimationId);
            ellieGameLoop();
        }

        function ellieTriggerJump() {
            if (ellieGameActive) {
                ellieVelocity = ellieJump;
            }
        }

        function ellieSpaceJump(e) {
            if (e.code === 'Space') {
                e.preventDefault();
                ellieTriggerJump();
            }
        }

        function stopEllieGame() {
            ellieGameActive = false;
            if (ellieAnimationId) cancelAnimationFrame(ellieAnimationId);
            window.removeEventListener('keydown', ellieSpaceJump);

            const overlay = document.getElementById('ellie-start-overlay');
            if (overlay) overlay.classList.remove('hidden');
        }

        function ellieGameLoop() {
            if (!ellieGameActive) return;

            const canvas = document.getElementById('ellie-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            ellieFrameCount++;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 1. Dibujar estrellas de fondo
            ctx.fillStyle = "rgba(255,255,255,0.15)";
            for (let i = 0; i < 20; i++) {
                const sx = (Math.sin(i * 100) * 0.5 + 0.5) * canvas.width;
                const sy = ((Math.cos(i * 50) * 0.5 + 0.5) * canvas.height + ellieFrameCount * 0.5) % canvas.height;
                ctx.fillRect(sx, sy, 2, 2);
            }

            // 2. Física de Ellie
            ellieVelocity += ellieGravity;
            ellieY += ellieVelocity;

            // Límites del canvas
            if (ellieY < 0) ellieY = 0;
            if (ellieY > canvas.height - 15) {
                ellieGameOver();
                return;
            }

            // Dibujar a Ellie (Cohete espacial o esfera brillante)
            ctx.beginPath();
            ctx.arc(40, ellieY, 8, 0, 2*Math.PI);
            ctx.fillStyle = "#a855f7"; // Púrpura de Ellie
            ctx.fill();
            // Fuego del cohete
            ctx.beginPath();
            ctx.arc(30, ellieY + (Math.sin(ellieFrameCount)*2), 4, 0, 2*Math.PI);
            ctx.fillStyle = "#f97316"; // Naranja
            ctx.fill();

            // 3. Generar Obstáculos (Asteroides)
            if (ellieFrameCount % 100 === 0) {
                const gap = 90;
                const minHeight = 40;
                const maxHeight = canvas.height - gap - minHeight;
                const h = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;

                obstacles.push({
                    x: canvas.width,
                    topHeight: h,
                    bottomY: h + gap,
                    width: 32,
                    passed: false
                });
            }

            // 4. Mover y Dibujar Obstáculos
            ctx.fillStyle = "rgba(99,102,241,0.6)"; // Azul espacial
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.x -= 2;

                // Dibujar bloque superior
                ctx.fillRect(o.x, 0, o.width, o.topHeight);
                // Dibujar bloque inferior
                ctx.fillRect(o.x, o.bottomY, o.width, canvas.height - o.bottomY);

                // Colisiones
                if (o.x < 48 && o.x + o.width > 32) {
                    if (ellieY - 8 < o.topHeight || ellieY + 8 > o.bottomY) {
                        ellieGameOver();
                        return;
                    }
                }

                // Sumar puntos
                if (!o.passed && o.x < 32) {
                    o.passed = true;
                    ellieScore++;
                    document.getElementById('ellie-score').innerText = ellieScore;
                    if (ellieScore > ellieHighscore) {
                        ellieHighscore = ellieScore;
                        document.getElementById('ellie-highscore').innerText = ellieHighscore;
                    }
                }

                // Eliminar fuera del canvas
                if (o.x + o.width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            ellieAnimationId = requestAnimationFrame(ellieGameLoop);
        }

        function ellieGameOver() {
            ellieGameActive = false;
            alert("Fin de la partida. Esquivaste " + ellieScore + " asteroides.");
            stopEllieGame();
        }

        // --- HOOKS DE INICIALIZACION ---
        const prevInitPageGames = initializePageComponents;
        function initializePageComponents(page) {
            if (page !== 'ellie' && ellieGameActive) {
                stopEllieGame();
            }
            if (page === 'todos') {
                drawWheel();
            }
            // Si ya hay permiso de ubicación, el pronóstico se pide solo; si no, la persona decide con el botón
            if (page === 'outfit' && !todayWeather) {
                hasLocationPermission().then((granted) => { if (granted) requestOutfitWeather(); });
            }
            if (typeof prevInitPageGames === 'function' && prevInitPageGames !== initializePageComponents) {
                prevInitPageGames(page);
            }
        }

        window.onload = function() {
            navigate('dashboard');
            restoreNativeData();
        };

        // Service worker solo en la web; en la app nativa (Capacitor) los archivos ya van dentro del paquete.
        if ('serviceWorker' in navigator && !isNativeApp() && location.protocol.startsWith('http')) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js').catch(function(err) {
                    console.warn('No se pudo registrar el service worker:', err);
                });
            });
        }

</script>
