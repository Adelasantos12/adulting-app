<script>
    // --- ESTADO PRINCIPAL (LOCAL STORAGE) ---
    const DEFAULT_STATE = {
        theme: 'purple', // purple, blue, green, rose, orange
        darkMode: false,
        fontStyle: 'sans', // sans, serif, dyslexic
        fontSize: 'base', // sm, base, lg, xl
        pesterMode: false,
        affirmationMode: true,

        // Tareas / Todos
        todos: [
            { id: 1, title: 'Lavar las toallas de baño', category: 'hogar', completed: false, recurring: 'semanal', lastDone: null },
            { id: 2, title: 'Limpieza profunda del refrigerador', category: 'hogar', completed: false, recurring: 'mensual', lastDone: null },
            { id: 3, title: 'Comprobar el reporte de crédito gratuito', category: 'adulting', completed: false, recurring: 'anual', lastDone: null },
            { id: 4, title: 'Llamar a mi abuela', category: 'personal', completed: false, recurring: 'libre', lastDone: null }
        ],

        // Vehículos (Garaje)
        vehicles: [
            {
                id: 1,
                name: 'Mi Coche Principal',
                brand: 'Toyota',
                model: 'Corolla',
                year: '2018',
                plate: 'ABC-1234',
                vin: '1NXBR32E...0000',
                mileage: 65000,
                insuranceCompany: 'Seguros Atlas',
                insurancePolicy: 'POL-9988-AA',
                insuranceExpiry: '2026-10-15',
                oilChangeInterval: 10000, // km o millas
                lastOilMileage: 60000,
                lastTireRotationDate: '2025-11-10',
                electric: false
            }
        ],

        // Presupuesto
        budget: {
            monthlyIncome: 2500,
            bills: [
                { id: 1, name: 'Alquiler / Hipoteca', amount: 950, dueDate: '2026-04-01', recur: 'mensual', paid: false },
                { id: 2, name: 'Luz y Energía', amount: 85, dueDate: '2026-03-25', recur: 'mensual', paid: false },
                { id: 3, name: 'Suscripción Streaming', amount: 15, dueDate: '2026-03-20', recur: 'mensual', paid: true },
                { id: 4, name: 'Seguro de coche', amount: 90, dueDate: '2026-03-28', recur: 'mensual', paid: false }
            ],
            paychecks: [
                { id: 1, source: 'Salario Principal', amount: 1250, date: '2026-03-15' },
                { id: 2, source: 'Salario Principal 2', amount: 1250, date: '2026-03-31' }
            ]
        },

        // Salud
        health: {
            prescriptions: [
                { id: 1, name: 'Multivitamínico diario', dosage: '1 tableta', time: '09:00', notes: 'Con el desayuno', alert: true },
                { id: 2, name: 'Medicamento alergias', dosage: '10mg', time: '21:00', notes: 'Por la noche si es necesario', alert: false }
            ],
            vaccines: [
                { id: 1, name: 'Refuerzo Tétanos', date: '2022-05-14', expiry: '2032-05-14' },
                { id: 2, name: 'Vacuna Influenza', date: '2025-10-01', expiry: '2026-10-01' }
            ],
            allergies: 'Ninguna alergia severa reportada.',
            doctors: [
                { id: 1, name: 'Dra. Gabriela Solís', specialty: 'Médico General', phone: '+52 55 1234 5678', notes: 'Consultorio 204, clínica médica norte' }
            ],
            notes: 'Presión arterial sistólica habitual: 115-120 mmHg.'
        },

        // Mascotas
        pets: [
            { id: 1, name: 'Loki', species: 'Gato', breed: 'Mestizo', birthday: '2020-05-12', microchip: '981022410294102', vetName: 'Clínica Veterinaria San Francisco', vetPhone: '555-987-654', notes: 'Comida húmeda una vez al día. Alérgico a vacunas de cierta marca.' }
        ],

        // Diario
        journalEntries: [
            { id: 1, date: '2026-03-01', text: 'Hoy comencé a usar mi app de organización personal. Me siento motivado para organizar mi garaje y mis finanzas!' }
        ],
        // Outfit Clima
        outfitSettings: {
            dayType: 'casual', // casual, work, event, conference
            lastLat: null,
            lastLng: null,
            lastCity: 'Geolocalización',
            weatherData: null // { temp, condition, rain, snow, wind, label }
        }
    };

    let state = JSON.parse(localStorage.getItem('adulting_app_state')) || DEFAULT_STATE;

    function saveState() {
        localStorage.setItem('adulting_app_state', JSON.stringify(state));
        updateThemeClasses();
        updateAlertIndicators();
    }

    // --- SISTEMA DE TEMAS Y APARIENCIA ---
    function updateThemeClasses() {
        // Eliminar clases previas del body o app wrapper
        const body = document.body;
        const root = document.documentElement;

        // Manejar modo oscuro
        if (state.darkMode) {
            root.classList.add('dark');
        } else {
            root.classList.remove('dark');
        }

        // Estilo de fuente
        body.classList.remove('font-sans', 'font-serif', 'font-dyslexic');
        if (state.fontStyle === 'dyslexic') {
            body.classList.add('font-dyslexic');
        } else if (state.fontStyle === 'serif') {
            body.classList.add('font-serif');
        } else {
            body.classList.add('font-sans');
        }

        // Tamaño de fuente
        body.classList.remove('text-sm', 'text-base', 'text-lg', 'text-xl');
        body.classList.add('text-' + state.fontSize);

        // Actualizar colores CSS variables o aplicar dinámicamente con JS
        // Para simplificar Tailwind dinámico, usamos un mapeo para colores principales
        const themeColors = {
            purple: { primary: 'text-purple-600', bg: 'bg-purple-600', hover: 'hover:bg-purple-700', activeBg: 'bg-purple-50', activeText: 'text-purple-600', border: 'border-purple-200' },
            blue: { primary: 'text-blue-600', bg: 'bg-blue-600', hover: 'hover:bg-blue-700', activeBg: 'bg-blue-50', activeText: 'text-blue-600', border: 'border-blue-200' },
            green: { primary: 'text-green-600', bg: 'bg-green-600', hover: 'hover:bg-green-700', activeBg: 'bg-green-50', activeText: 'text-green-600', border: 'border-green-200' },
            rose: { primary: 'text-rose-600', bg: 'bg-rose-600', hover: 'hover:bg-rose-700', activeBg: 'bg-rose-50', activeText: 'text-rose-600', border: 'border-rose-200' },
            orange: { primary: 'text-orange-600', bg: 'bg-orange-600', hover: 'hover:bg-orange-700', activeBg: 'bg-orange-50', activeText: 'text-orange-600', border: 'border-orange-200' }
        };

        const activeColor = themeColors[state.theme] || themeColors.purple;

        // Re-estilizar dinámicamente botones del menú de navegación
        document.querySelectorAll('.nav-btn, .mobile-nav-btn').forEach(btn => {
            const page = btn.getAttribute('data-page');
            const isActive = page === currentPage;

            btn.className = btn.classList.contains('mobile-nav-btn')
                ? "mobile-nav-btn flex flex-col items-center gap-0.5 text-xs font-semibold " + (isActive ? activeColor.primary : "text-slate-400 dark:text-slate-500")
                : "nav-btn w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-150 " + (isActive ? `${activeColor.activeBg} ${activeColor.activeText} dark:bg-slate-700` : "text-slate-600 hover:bg-slate-50 dark:text-slate-300 dark:hover:bg-slate-700/50");
        });
    }

    function toggleDarkMode() {
        state.darkMode = !state.darkMode;
        saveState();
    }

    // --- ALERTAS (ALERT INDICATORS) ---
    function checkAlerts() {
        let hasAlerts = false;

        // 1. Verificar aceite de vehículos
        state.vehicles.forEach(v => {
            if (v.mileage - v.lastOilMileage >= v.oilChangeInterval) {
                hasAlerts = true;
            }
            // Verificar expiración de seguro
            if (v.insuranceExpiry) {
                const expiryDate = new Date(v.insuranceExpiry);
                const diffTime = expiryDate - new Date();
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (diffDays <= 30) {
                    hasAlerts = true;
                }
            }
        });

        // 2. Facturas vencidas
        state.budget.bills.forEach(bill => {
            if (!bill.paid) {
                const dueDate = new Date(bill.dueDate);
                if (dueDate < new Date()) {
                    hasAlerts = true;
                }
            }
        });

        return hasAlerts;
    }

    function updateAlertIndicators() {
        const hasAlerts = checkAlerts();
        const dot = document.getElementById('quick-alert-dot');
        if (dot) {
            if (hasAlerts) {
                dot.classList.remove('hidden');
            } else {
                dot.classList.add('hidden');
            }
        }
    }

    // --- NAVEGACIÓN Y CARGA DE PÁGINAS ---
    let currentPage = 'dashboard';

    function navigate(page) {
        currentPage = page;

        // Actualizar título de página
        const titles = {
            dashboard: 'Panel Principal',
            todos: 'Tareas & Ruleta',
            garage: 'Mi Garaje & Automóvil',
            budget: 'Mi Presupuesto',
            'health-pets': 'Salud & Mascotas',
            guides: 'Adulting 101 - Guías',
            wellbeing: 'Bienestar & Paz Mental',
            outfit: 'Qué me pongo - Clima',
            settings: 'Ajustes'
        };

        const pageTitle = document.getElementById('page-title');
        if (pageTitle) pageTitle.innerText = titles[page] || 'SerAdulto';

        // Renderizar página seleccionada
        const pageContent = document.getElementById('page-content');
        if (pageContent) {
            pageContent.innerHTML = renderPage(page);
            // Ejecutar inicializadores específicos de página
            initializePageComponents(page);
        }

        updateThemeClasses();
        lucide.createIcons();
    }
</script>

<script>
    // --- FRASES DE AFIRMACIÓN ---
    const FRASES = [
        "Estás haciéndolo excelente. Ser adulto no es fácil, pero estás aprendiendo paso a paso.",
        "No necesitas tener todo resuelto hoy. Un pequeño paso a la vez es suficiente.",
        "Tu valor no se mide por tu productividad. Tómate un respiro si lo necesitas.",
        "Organizar tu vida es un acto de amor propio y cuidado personal.",
        "¡Eres capaz de manejar llamadas difíciles, presupuestos y tareas pendientes!",
        "La paciencia contigo mismo es clave durante esta transición."
    ];

    // --- RENDERIZADO DE PÁGINAS ---
    function renderPage(page) {
        const themeColor = state.theme;

        switch (page) {
            case 'dashboard':
                // Calcular alertas detalladas
                let alertsHtml = '';
                let alertCount = 0;

                state.vehicles.forEach(v => {
                    if (v.mileage - v.lastOilMileage >= v.oilChangeInterval) {
                        alertCount++;
                        alertsHtml += `
                            <div class="flex items-start gap-3 p-4 bg-amber-50 dark:bg-amber-950/30 border-l-4 border-amber-500 rounded-r-xl">
                                <i data-lucide="alert-triangle" class="w-5 h-5 text-amber-600 dark:text-amber-400 mt-0.5 flex-shrink-0"></i>
                                <div>
                                    <h4 class="font-bold text-amber-900 dark:text-amber-200 text-sm">Cambio de Aceite Vencido: ${v.name}</h4>
                                    <p class="text-xs text-amber-700 dark:text-amber-300">Kilometraje actual: ${v.mileage} km. Último cambio hace ${v.mileage - v.lastOilMileage} km (Recomendado cada ${v.oilChangeInterval} km).</p>
                                </div>
                            </div>
                        `;
                    }
                    if (v.insuranceExpiry) {
                        const expiry = new Date(v.insuranceExpiry);
                        const diffDays = Math.ceil((expiry - new Date()) / (1000 * 60 * 60 * 24));
                        if (diffDays <= 30 && diffDays > 0) {
                            alertCount++;
                            alertsHtml += `
                                <div class="flex items-start gap-3 p-4 bg-rose-50 dark:bg-rose-950/30 border-l-4 border-rose-500 rounded-r-xl">
                                    <i data-lucide="shield-alert" class="w-5 h-5 text-rose-600 dark:text-rose-400 mt-0.5 flex-shrink-0"></i>
                                    <div>
                                        <h4 class="font-bold text-rose-900 dark:text-rose-200 text-sm">Seguro por vencer: ${v.name}</h4>
                                        <p class="text-xs text-rose-700 dark:text-rose-300">La póliza expira el ${v.insuranceExpiry} (en ${diffDays} días). ¡Prepara tu presupuesto!</p>
                                    </div>
                                </div>
                            `;
                        } else if (diffDays <= 0) {
                            alertCount++;
                            alertsHtml += `
                                <div class="flex items-start gap-3 p-4 bg-rose-50 dark:bg-rose-950/30 border-l-4 border-rose-600 rounded-r-xl">
                                    <i data-lucide="shield-off" class="w-5 h-5 text-rose-600 dark:text-rose-400 mt-0.5 flex-shrink-0"></i>
                                    <div>
                                        <h4 class="font-bold text-rose-900 dark:text-rose-200 text-sm">¡Seguro Expirado! ${v.name}</h4>
                                        <p class="text-xs text-rose-700 dark:text-rose-300">La póliza venció el ${v.insuranceExpiry}. No conduzcas sin seguro vigente.</p>
                                    </div>
                                </div>
                            `;
                        }
                    }
                });

                state.budget.bills.forEach(bill => {
                    if (!bill.paid) {
                        const dueDate = new Date(bill.dueDate);
                        const today = new Date();
                        if (dueDate < today) {
                            alertCount++;
                            alertsHtml += `
                                <div class="flex items-start gap-3 p-4 bg-rose-50 dark:bg-rose-950/30 border-l-4 border-rose-500 rounded-r-xl">
                                    <i data-lucide="clock" class="w-5 h-5 text-rose-600 dark:text-rose-400 mt-0.5 flex-shrink-0"></i>
                                    <div>
                                        <h4 class="font-bold text-rose-900 dark:text-rose-200 text-sm">Factura Vencida: ${bill.name}</h4>
                                        <p class="text-xs text-rose-700 dark:text-rose-300">Venció el ${bill.dueDate} por un monto de $${bill.amount}.</p>
                                    </div>
                                </div>
                            `;
                        }
                    }
                });

                const randomFrase = FRASES[Math.floor(Math.random() * FRASES.length)];
                const completedTodos = state.todos.filter(t => t.completed).length;
                const totalTodos = state.todos.length;
                const completionRate = totalTodos > 0 ? Math.round((completedTodos / totalTodos) * 100) : 0;

                return `
                    <!-- Frase de afirmación -->
                    ${state.affirmationMode ? `
                    <div class="p-6 bg-gradient-to-r from-theme-${themeColor}-500 to-theme-${themeColor}-600 text-white rounded-3xl shadow-xl shadow-theme-${themeColor}-500/20 relative overflow-hidden">
                        <div class="absolute -right-10 -bottom-10 opacity-10">
                            <i data-lucide="sparkles" class="w-48 h-48"></i>
                        </div>

                        <p class="text-lg md:text-xl font-semibold mt-2 max-w-2xl leading-relaxed">"${randomFrase}"</p>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                                    <i data-lucide="check-square" class="w-6 h-6"></i>
                                </span>
                                <span class="text-xs font-semibold text-slate-400">Progreso Diario</span>
                            </div>
                            <h3 class="text-3xl font-bold mb-1">${completedTodos}/${totalTodos}</h3>
                            <p class="text-sm text-slate-500 mb-4">Tareas completadas</p>
                            <div class="w-full bg-slate-100 dark:bg-slate-700 rounded-full h-2">
                                <div class="bg-indigo-600 h-2 rounded-full" style="width: ${completionRate}%"></div>
                            </div>
                        </div>

                        <!-- Presupuesto -->
                        <div class="p-6 bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">

                                    <i data-lucide="wallet" class="w-6 h-6"></i>
                                </span>
                                <span class="text-xs font-semibold text-slate-400">Facturas Pendientes</span>
                            </div>
                            <h3 class="text-3xl font-bold mb-1">$${state.budget.bills.filter(b => !b.paid).reduce((sum, b) => sum + b.amount, 0)}</h3>
                            <p class="text-sm text-slate-500 mb-4">Monto total por pagar</p>
                            <span class="text-xs px-2.5 py-1 bg-emerald-100 dark:bg-emerald-900 text-emerald-800 dark:text-emerald-200 rounded-full font-medium">Fórmula offline-first</span>

                            <h3 class="text-3xl font-bold mb-1">${state.vehicles.length}</h3>
                            <p class="text-sm text-slate-500 mb-4">En tu garaje digital</p>
                            <button onclick="navigate('garage')" class="text-xs font-bold text-theme-${themeColor}-600 dark:text-theme-${themeColor}-400 hover:underline">Ver mantenimientos →</button>

                    </div>

                    <!-- Panel de alertas y peligros -->
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-100 dark:border-slate-700 space-y-4 shadow-sm">
                        <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-700 pb-3">
                            <h3 class="text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                                <i data-lucide="shield-alert" class="w-5 h-5 text-rose-500"></i>
                                Alertas de Supervivencia

                            <span class="px-2.5 py-0.5 bg-rose-100 dark:bg-rose-900 text-rose-800 dark:text-rose-200 text-xs rounded-full font-bold">${alertCount} Activas</span>

                        <div class="space-y-3">
                            ${alertsHtml !== '' ? alertsHtml : `
                                <div class="flex flex-col items-center justify-center py-6 text-slate-400">
                                    <i data-lucide="check-circle" class="w-10 h-10 text-emerald-500 mb-2"></i>
                                    <p class="text-sm font-semibold text-slate-600 dark:text-slate-300">¡Todo al día!</p>
                                    <p class="text-xs text-slate-400">No tienes alertas pendientes de presupuesto ni coche.</p>
                                </div>
                            `}
                        </div>
                    </div>
                `;

            case 'todos':
                let todoListHtml = '';
                state.todos.forEach(todo => {
                    todoListHtml += `
                        <div class="flex items-center justify-between p-4 bg-white dark:bg-slate-800 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700">
                            <div class="flex items-center gap-3">
                                <input type="checkbox" ${todo.completed ? 'checked' : ''} onchange="toggleTodo(${todo.id})" class="w-5 h-5 rounded border-slate-300 text-theme-${themeColor}-600 focus:ring-theme-${themeColor}-500">

                            </div>

                return `
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                        <div class="lg:col-span-2 space-y-4">

                        <div class="bg-white dark:bg-slate-800 p-6 rounded-2xl border border-slate-100 dark:border-slate-700 shadow-sm text-center flex flex-col items-center">

                            <div class="wheel-container mb-6">

                                <div class="absolute top-0 left-1/2 -translate-x-1/2 -translate-y-2 z-10 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[20px] border-t-rose-500"></div>
                            </div>

                            <button onclick="spinWheel()" class="w-full py-3 bg-theme-${themeColor}-600 hover:bg-theme-${themeColor}-700 text-white rounded-xl text-sm font-semibold shadow-md shadow-theme-${themeColor}-500/20 flex items-center justify-center gap-2">
                                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                                ¡Girar Ruleta!
                            </button>
                            <p id="wheel-result" class="mt-4 text-sm font-bold text-theme-${themeColor}-600 dark:text-theme-${themeColor}-400 min-h-[20px]"></p>
                        </div>
                    </div>
                `;

            case 'garage':
                let vehicleCardsHtml = '';
                state.vehicles.forEach((v, index) => {
                    const oilProgress = Math.min(((v.mileage - v.lastOilMileage) / v.oilChangeInterval) * 100, 100);
                    const isOilOverdue = (v.mileage - v.lastOilMileage) >= v.oilChangeInterval;

                    vehicleCardsHtml += `

                                    <h4 class="font-bold text-slate-900 dark:text-white">${v.name}</h4>

                            <div class="space-y-1.5 pt-2">
                                <div class="flex justify-between text-xs font-semibold">
                                    <span class="text-slate-500">Estado del Aceite de Motor</span>
                                    <span class="${isOilOverdue ? 'text-rose-500 font-bold' : 'text-slate-400'}">${v.mileage - v.lastOilMileage} / ${v.oilChangeInterval} km</span>

<script>
    // --- LÓGICA DE INTERACCIÓN DE COMPONENTES ---

    // Tareas / Todos
    function addTodo(e) {
        e.preventDefault();
        const titleInput = document.getElementById('new-todo-title');
        const categorySelect = document.getElementById('new-todo-category');
        if (!titleInput) return;

        const newTodo = {
            id: Date.now(),
            title: titleInput.value.trim(),
            category: categorySelect.value,
            completed: false,
            recurring: 'libre',
            lastDone: null
        };

        state.todos.push(newTodo);
        saveState();
        navigate('todos');
    }

    function toggleTodo(id) {
        state.todos = state.todos.map(todo => {
            if (todo.id === id) {
                const completed = !todo.completed;
                return { ...todo, completed, lastDone: completed ? new Date().toISOString().split('T')[0] : todo.lastDone };
            }
            return todo;
        });
        saveState();
        navigate('todos');
    }

    function deleteTodo(id) {
        state.todos = state.todos.filter(todo => todo.id !== id);
        saveState();
        navigate('todos');
    }

    // Ruleta de Decisiones (Executive Dysfunction Wheel)
    let isSpinning = false;
    let wheelAngle = 0;

    function drawWheel() {
        const canvas = document.getElementById('wheel-canvas');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const center = canvas.width / 2;

        // Obtener tareas activas no completadas (máximo 6 para visualización ideal)
        let activeTasks = state.todos.filter(t => !t.completed).map(t => t.title);
        if (activeTasks.length === 0) {
            activeTasks = ['Añadir tareas pendientes', 'Tomarse un vaso de agua', 'Lavar los trastes', 'Descansar 5 minutos'];
        }

        const slices = activeTasks.length;
        const sliceAngle = (2 * Math.PI) / slices;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const colors = ['#a855f7', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#6366f1', '#14b8a6'];

        for (let i = 0; i < slices; i++) {
            ctx.beginPath();
            ctx.fillStyle = colors[i % colors.length];
            ctx.moveTo(center, center);
            ctx.arc(center, center, center - 10, i * sliceAngle + wheelAngle, (i + 1) * sliceAngle + wheelAngle);
            ctx.lineTo(center, center);
            ctx.fill();

            // Texto en cada rebanada
            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(i * sliceAngle + sliceAngle / 2 + wheelAngle);
            ctx.textAlign = "right";
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 10px sans-serif";

            let text = activeTasks[i];
            if (text.length > 18) text = text.substring(0, 15) + '...';
            ctx.fillText(text, center - 20, 5);
            ctx.restore();
        }

        // Centro de la ruleta
        ctx.beginPath();
        ctx.arc(center, center, 20, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.shadowColor = 'rgba(0,0,0,0.2)';
        ctx.shadowBlur = 4;
    }

    function spinWheel() {
        if (isSpinning) return;

        let activeTasks = state.todos.filter(t => !t.completed);
        if (activeTasks.length === 0) {
            activeTasks = [
                { title: 'Añadir tareas pendientes' },
                { title: 'Tomarse un vaso de agua' },
                { title: 'Lavar los trastes' },
                { title: 'Descansar 5 minutos' }
            ];
        }

        isSpinning = true;
        const resultText = document.getElementById('wheel-result');
        if (resultText) resultText.innerText = 'Eligiendo tu destino...';

        const spinSpeed = 0.4 + Math.random() * 0.3; // velocidad de rotación inicial
        let currentSpeed = spinSpeed;
        const friction = 0.985; // frenado lento

        function animate() {
            if (currentSpeed < 0.002) {
                isSpinning = false;

                // Calcular qué rebanada está arriba (ángulo 1.5 * Math.PI)
                const slices = activeTasks.length;
                const sliceAngle = (2 * Math.PI) / slices;

                // Normalizar ángulo entre 0 y 2*PI
                let normalizedAngle = (1.5 * Math.PI - wheelAngle) % (2 * Math.PI);
                if (normalizedAngle < 0) normalizedAngle += 2 * Math.PI;

                const chosenIndex = Math.floor(normalizedAngle / sliceAngle) % slices;
                const chosenTask = activeTasks[chosenIndex];

                if (resultText) {
                    resultText.innerHTML = `⭐ ¡Tu tarea elegida es:<br><span class="text-base text-purple-700 dark:text-purple-300 font-extrabold">"${chosenTask.title}"</span>!`;
                }
                return;
            }

            wheelAngle += currentSpeed;
            currentSpeed *= friction;
            drawWheel();
            requestAnimationFrame(animate);
        }

        animate();
    }

    // --- MI GARAJE ---
    function openAddVehicleModal() {
        const modal = document.getElementById('add-vehicle-modal');
        if (modal) modal.classList.remove('hidden');
    }

    function closeAddVehicleModal() {
        const modal = document.getElementById('add-vehicle-modal');
        if (modal) modal.classList.add('hidden');
    }

    function addVehicle(e) {
        e.preventDefault();
        const name = document.getElementById('add-v-name').value.trim();
        const brand = document.getElementById('add-v-brand').value.trim();
        const model = document.getElementById('add-v-model').value.trim();
        const mileage = parseInt(document.getElementById('add-v-mileage').value) || 0;
        const oilInterval = parseInt(document.getElementById('add-v-oil').value) || 10000;
        const insurance = document.getElementById('add-v-ins').value.trim();
        const expiry = document.getElementById('add-v-expiry').value;

        const newVehicle = {
            id: Date.now(),
            name,
            brand,
            model,
            year: new Date().getFullYear().toString(),
            plate: 'S-REGISTRAR',
            vin: 'S-REGISTRAR',
            mileage,
            insuranceCompany: insurance,
            insurancePolicy: 'S/N',
            insuranceExpiry: expiry,
            oilChangeInterval: oilInterval,
            lastOilMileage: mileage,
            lastTireRotationDate: '',
            electric: false
        };

        state.vehicles.push(newVehicle);
        saveState();
        closeAddVehicleModal();
        navigate('garage');
    }

    function quickUpdateMileage(id) {
        const currentMil = state.vehicles.find(v => v.id === id).mileage;
        const newMil = prompt(`Introduce el kilometraje actual (Actual: ${currentMil} km):`, currentMil);
        if (newMil !== null && !isNaN(newMil) && parseInt(newMil) >= currentMil) {
            state.vehicles = state.vehicles.map(v => v.id === id ? { ...v, mileage: parseInt(newMil) } : v);
            saveState();
            navigate('garage');
        } else if (newMil !== null) {
            alert("Introduce un kilometraje válido y mayor o igual al actual.");
        }
    }

    function resetOilChange(id) {
        const v = state.vehicles.find(v => v.id === id);
        if (confirm(`¿Confirmas que se completó el cambio de aceite para ${v.name} en el kilometraje actual (${v.mileage} km)?`)) {
            state.vehicles = state.vehicles.map(v => v.id === id ? { ...v, lastOilMileage: v.mileage } : v);
            saveState();
            navigate('garage');
        }
    }

    // --- INICIALIZADOR DE COMPONENTES ---
    function initializePageComponents(page) {
        if (page === 'todos') {
            drawWheel();
        }
    }
</script>

    function applyEspModifiers(base, weather) {
        const result = { ...base };
        const { rain, snow, condition, wind } = weather;

        if (snow || condition === 'snow' || condition === 'storm') {
            result.outer = 'wool-coat';
            result.shoes = 'ankle-boots';
            result.extras = ['scarf'];
        }

        if (rain && result.shoes === 'white-sneakers') {
            result.shoes = 'ankle-boots';
        }

        if (rain || condition === 'storm') {
            result.extras = [...(result.extras || []), 'umbrella'];
        }

        if (wind === 'strong' && !result.outer) {
            result.outer = 'light-jacket';
        }

        return result;
    }

    function generateEspRecommendation(weather, dayType) {
        if (!weather) return null;
        const tempBand = getEspTempBand(weather.temp);
        const formality = ESP_FORMALITY[dayType] ?? 'RELAXED';

        const baseSlots = ESP_MATRIX[tempBand]?.[formality] ?? ESP_MATRIX['MILD']['RELAXED'];
        const primary = applyEspModifiers({ ...baseSlots }, weather);
        const reason = buildEspReason(weather, dayType);

        // Generar alternativas simples
        const altSlots = { ...primary };
        if (primary.layer === 'blazer') altSlots.layer = 'sweater';
        else if (primary.layer === 'sweater') altSlots.layer = 'cardigan';
        else if (primary.layer === 'cardigan') altSlots.layer = 'sweater';

        const alt = applyEspModifiers(altSlots, weather);

        return {
            primary,
            alternative: alt,
            reason
        };
    }

    // --- ACCIONES DE GEOLOCALIZACIÓN Y CONSULTA DE CLIMA ---
    function fetchLocalWeather() {
        if (!navigator.geolocation) {
            alert("La geolocalización no está soportada por tu navegador. Prueba manualmente.");
            return;
        }

        // Mostrar estado de carga breve
        const oSettings = state.outfitSettings;
        oSettings.lastCity = "Obteniendo ubicación...";
        saveState();
        navigate('outfit');

        navigator.geolocation.getCurrentPosition(
            async (position) => {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;

                try {
                    const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
                    const data = await response.json();

                    if (data && data.current_weather) {
                        const weather = data.current_weather;
                        const simplified = decodeEspWeather(weather.weathercode, weather.windspeed, weather.temperature);

                        oSettings.lastLat = lat;
                        oSettings.lastLng = lng;
                        oSettings.lastCity = "Tu Ciudad (Ubicación Local)";
                        oSettings.weatherData = simplified;

                        saveState();
                        navigate('outfit');
                    } else {
                        alert("No pudimos consultar la información del clima actual.");
                    }
                } catch (error) {
                    alert("Error de conexión al obtener el clima actual.");
                }
            },
            () => {
                alert("Por favor, permite el acceso a tu geolocalización para poder recomendarte ropa.");
                oSettings.lastCity = "Geolocalización denegada";
                saveState();
                navigate('outfit');
            }
        );
    }

    function changeOutfitDayType(type) {
        state.outfitSettings.dayType = type;
        saveState();
        navigate('outfit');
    }
</script>

                            <option value="lg" ${state.fontSize === 'lg' ? 'selected' : ''}>Grande</option>

                        <div class="flex flex-col sm:flex-row gap-2 pt-2">

    // --- ACCIONES DE AJUSTES ---
    function changeThemeColor(color) {
        state.theme = color;
        saveState();
        navigate('settings');
    }

    function changeFontStyle(style) {
        state.fontStyle = style;
        saveState();
        navigate('settings');
    }

    function changeFontSize(size) {
        state.fontSize = size;
        saveState();
        navigate('settings');
    }

    function toggleAffirmationMode() {
        state.affirmationMode = !state.affirmationMode;
        saveState();
        navigate('settings');
    }

    function exportData() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `seradulto_backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function triggerImport() {
        document.getElementById('import-file').click();
    }

    function importData(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
            try {
                const parsedData = JSON.parse(evt.target.result);
                if (parsedData && typeof parsedData === 'object' && parsedData.todos) {
                    state = parsedData;
                    saveState();
                    alert("¡Datos importados exitosamente!");
                    navigate('dashboard');
                } else {
                    alert("El archivo de respaldo no tiene el formato correcto.");
                }
            } catch (err) {
                alert("Error al leer el archivo de respaldo.");
            }
        };
        reader.readAsText(file);
    }

    function resetAllData() {
        if (confirm("🚨 ¿ESTÁS ABSOLUTAMENTE SEGURO? Esto borrará todas tus tareas, registros de autos, presupuesto, notas de salud y diarios permanentemente de este dispositivo.")) {
            state = JSON.parse(JSON.stringify(DEFAULT_STATE));
            saveState();
            navigate('dashboard');
        }
    }

    // --- CARGAR PÁGINA INICIAL AL CARGAR LA SPA ---
    window.onload = function() {
        navigate('dashboard');
    };
</script>
